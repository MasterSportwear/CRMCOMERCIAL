<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f3f2; --surface:#ffffff; --ink:#0b0b0b; --ink2:#4d4d4d; --muted:#858585; --line:#e3e3e1;
  --accent:#ff6600; --accent-ink:#b34700; --accent-soft:#fff0e5; --black:#0b0b0b;
  --good:#0ca30c; --good-ink:#006300; --crit:#d03b3b; --warn:#fab219;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hide{display:none!important}

/* layout */
#app{display:flex;min-height:100%}
nav{width:216px;flex:none;background:var(--black);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav .brand{padding:6px 10px 16px;text-align:center}
nav .brand img{width:118px;display:block;margin:0 auto 8px}
nav .brand span{color:#9a9a9a;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
nav a{display:block;padding:9px 12px;border-radius:8px;color:#d6d6d6;text-decoration:none;font-weight:500}
nav a:hover{background:#1f1f1f;color:#fff}
nav a.on{background:var(--accent);color:#0b0b0b;font-weight:650}
nav .who{margin-top:auto;padding:12px 10px 4px;border-top:1px solid #2a2a2a;font-size:13px;color:#fff}
nav .who .muted{color:#9a9a9a}
nav .who a{color:var(--accent)}
nav .who a:hover{background:none;color:#ff8a3d}
main{flex:1;min-width:0;padding:22px 26px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
h1{font-weight:750;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){
  #app{flex-direction:column}
  nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
  nav .brand{padding:2px 8px}
  nav .brand img{width:44px;margin:0}
  nav .brand span{display:none}
  nav a{padding:7px 10px}
  nav .who{margin:0 0 0 auto;border:0;padding:4px 8px}
  main{padding:14px 12px 60px}
  .grid2{grid-template-columns:1fr}
}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#c9c7c0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0b0b0b;font-weight:650}
.btn.pri:hover{background:#ff8126;border-color:#ff8126}
.btn.good{background:var(--good-ink);border-color:var(--good-ink);color:#fff}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;max-width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.field{margin-bottom:12px}
.field input,.field select,.field textarea{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--ink2);font-weight:600}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--ink2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.num{text-align:right}
th.sort{cursor:pointer}
th.sort:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f6f3}
tr.total td{font-weight:650;border-top:2px solid var(--line);background:#f7f6f3}
.lvl1 td:first-child{padding-left:30px}
.lvl2 td:first-child{padding-left:52px}
.lvl1 td,.lvl2 td{background:#faf9f7}
.tgl{display:inline-block;width:16px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:#eceae5;color:var(--ink2);white-space:nowrap}
.badge.ad{background:var(--accent-soft);color:var(--accent-ink)}
.badge.won{background:#e2f4e2;color:var(--good-ink)}
.badge.lost{background:#fbe6e6;color:#a32626}
.badge.wait{background:#fff1cf;color:#6b4a00}

/* funnel */
.funil{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px 70px 90px 70px 70px;gap:0 12px;align-items:center}
.funil .h{font-size:12px;color:var(--ink2);font-weight:600;padding-bottom:8px}
.funil .bar{height:22px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.funil .cell{padding:7px 0}
.funil .track{padding:7px 0}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:#eceae5;font-variant-numeric:tabular-nums}
@media(max-width:700px){.funil{grid-template-columns:110px 1fr 54px 60px}.funil .x{display:none}}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 44px;gap:6px 10px;align-items:center}
.hbar .bar{height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}

/* heat cells (divergente: laranja acima da média, cinza abaixo; a seta reforça a direção) */
.heat{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat small{color:var(--ink2);font-size:11px;margin-left:3px}

/* kanban */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 250px;background:#e9e9e7;border-top:3px solid var(--black);border-radius:var(--radius);padding:8px;max-height:calc(100vh - 190px);display:flex;flex-direction:column}
.col.rec{background:#fff0e5;border-top-color:var(--accent)}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:12px;margin:2px 4px 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2)}
.col .list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:40px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.lead:hover{border-color:#bdbbb4}
.lead .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .m{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(11,11,11,.4);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:720px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.sm{max-width:420px}
.modal .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.modal .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 10px}
.tabs button{border:0;background:none;padding:7px 10px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.msg{max-width:80%;padding:6px 10px;border-radius:10px;margin:4px 0;background:#eceae5;white-space:pre-wrap;word-break:break-word}
.msg.out{margin-left:auto;background:var(--accent-soft)}
.msg small{display:block;color:var(--muted);font-size:11px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f0efec;border-radius:6px;padding:8px 10px;word-break:break-all;user-select:all}

#tip{position:fixed;pointer-events:none;background:#0b0b0b;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:99;max-width:260px;white-space:pre-line;display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#fff;border-left:4px solid var(--accent);padding:9px 16px;border-radius:8px;z-index:100;display:none;max-width:90vw}
#toast.err{background:var(--crit)}
.login{max-width:380px;margin:0 auto;padding:7vh 14px}
.login .lg{display:block;width:150px;margin:0 auto 22px}
body.dark{background:var(--black)}
.note{background:#fff8e3;border:1px solid #f1dfa6;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
svg text{font:11px system-ui,sans-serif;fill:var(--ink2)}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="tip"></div>
<div id="toast"></div>
<script>
"use strict";
/* ====================== CONFIGURAÇÃO ======================

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("pt-BR");
const int = (n) => nf.format(Math.round(Number(n) || 0));
const brl = (n, dec = 0) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: dec, minimumFractionDigits: dec }).format(Number(n) || 0);
const pct = (a, b, dec = 0) => (Number(b) > 0 ? (100 * a / b).toFixed(dec).replace(".", ",") + "%" : "—");
const div = (a, b) => (Number(b) > 0 ? a / b : null);
const hojeBR = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dataBR = (iso) => (iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + (iso.length > 10 ? "" : "") : "");
const dataHora = (ts) => (ts ? new Date(ts).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
const minutos = (m) => (m == null ? "—" : m < 60 ? Math.round(m) + " min" : m < 1440 ? (m / 60).toFixed(1).replace(".", ",") + " h" : (m / 1440).toFixed(1).replace(".", ",") + " d");
const fone = (t) => { if (!t) return ""; const m = t.match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : "+" + t; };

const semAtendimento = (l) => { if (l.status !== "aberto" || l.etapa_id !== 1 || l.atendido_em) return ""; const h = (Date.now() - new Date(l.criado_em)) / 36e5; return h > 2 ? `<span class="badge lost" data-tip="Chegou há ${minutos(h * 60)} e ninguém assumiu">Sem atendimento</span>` : `<span class="badge wait">Novo</span>`; };
const retornoBadge = (l) => { if (l.status !== "aberto" || !l.proximo_contato) return ""; const h = hojeBR(); return l.proximo_contato < h ? `<span class="badge lost" data-tip="Retorno agendado para ${dataBR(l.proximo_contato)}">Retorno atrasado</span>` : l.proximo_contato === h ? `<span class="badge wait">Retorno hoje</span>` : ""; };

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), err ? 6000 : 2600); }
const falha = (e) => { console.error(e); toast(e?.message || String(e), true); };
async function q(promise) { const { data, error, count } = await promise; if (error) throw error; return count != null ? { data, count } : data; }
// O servidor devolve no máximo 1.000 linhas por consulta: busca em páginas até trazer tudo
async function todos(montar, max = 20000) {
  const saida = [];
  for (let ini = 0; ini < max; ini += 1000) {
    const parte = await q(montar().range(ini, ini + 999));
    saida.push(...parte);
    if (parte.length < 1000) break;
  }
  return saida;
}
async function fn(nome, body) {
  const { data, error } = await sb.functions.invoke(nome, { body });
  if (error) { let m = error.message; try { const j = await error.context.json(); m = j.erro || m; } catch (_) {} throw new Error(m); }
  if (data?.erro) throw new Error(data.erro);
  return data;
}

// dica flutuante (hover) para qualquer elemento com data-tip
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest?.("[data-tip]"), tip = $("#tip");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + "px";
  tip.style.top = (e.clientY + h + 20 > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
});

async function iniciar() {
  let url = CFG.url, key = CFG.key;
  if (url.startsWith("__")) { url = localStorage.getItem("crm_url") || ""; key = localStorage.getItem("crm_key") || ""; }
  if (!url || !key) return telaConexao();
  sb = window.supabase.createClient(url, key);
  const { data } = await sb.auth.getSession();
  if (data?.session) return entrar();
  telaLogin();
}

async function entrar() {

const PRESETS = [["hoje", "Hoje"], ["7d", "7 dias"], ["30d", "30 dias"], ["mes", "Este mês"], ["mesant", "Mês passado"], ["90d", "90 dias"]];
function aplicarPreset(p) {
  const h = hojeBR(); let ini = h, fim = h;
  if (p === "7d") ini = addDias(h, -6);
  if (p === "30d") ini = addDias(h, -29);
  if (p === "90d") ini = addDias(h, -89);
  if (p === "mes") ini = h.slice(0, 8) + "01";
  if (p === "mesant") { fim = addDias(h.slice(0, 8) + "01", -1); ini = fim.slice(0, 8) + "01"; }
  st.periodo = { preset: p, ini, fim };
}
function filtrosHTML({ vendedora = false, origem = false } = {}) {
  const p = st.periodo;
  return `<div class="filters">
    <div class="seg">${PRESETS.map(([k, n]) => `<button data-preset="${k}" class="${p.preset === k ? "on" : ""}">${n}</button>`).join("")}</div>
    <input type="date" id="fi" value="${p.ini}" aria-label="Início"> <span class="muted">até</span> <input type="date" id="ff" value="${p.fim}" aria-label="Fim">
    ${vendedora && gestor() ? `<select id="fv" aria-label="Vendedora"><option value="">Todas as vendedoras</option>${perfis.filter((x) => x.papel === "vendedora").map((x) => `<option value="${x.id}" ${st.vendedora === x.id ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>` : ""}
    ${origem ? `<select id="fo" aria-label="Origem"><option value="">Todas as origens</option>${Object.entries(ORIGENS).map(([k, n]) => `<option value="${k}" ${st.origem === k ? "selected" : ""}>${n}</option>`).join("")}</select>` : ""}
  </div>`;
}
function ligarFiltros(recarregar) {
  $$("[data-preset]").forEach((b) => (b.onclick = () => { aplicarPreset(b.dataset.preset); recarregar(); }));
  const fi = $("#fi"), ff = $("#ff");
  const custom = () => { if (fi.value && ff.value && fi.value <= ff.value) { st.periodo = { preset: "", ini: fi.value, fim: ff.value }; recarregar(); } };
  fi.onchange = custom; ff.onchange = custom;
  if ($("#fv")) $("#fv").onchange = (e) => { st.vendedora = e.target.value; recarregar(); };
  if ($("#fo")) $("#fo").onchange = (e) => { st.origem = e.target.value; recarregar(); };
}

function graficoDias(dias, max) {
  if (!dias.length) return `<div class="empty">Sem dados.</div>`;
  const W = 560, H = 190, L = 30, B = 22, T = 8, n = dias.length, slot = (W - L) / n, bw = Math.max(2, Math.min(18, slot - 2));
  const passo = Math.max(1, Math.ceil(max / 3)), ticks = []; for (let v = 0; v <= max; v += passo) ticks.push(v);
  const topo = ticks[ticks.length - 1] < max ? ticks[ticks.length - 1] + passo : ticks[ticks.length - 1]; if (topo > ticks[ticks.length - 1]) ticks.push(topo);
  const y = (v) => T + (H - T - B) * (1 - v / topo), cada = Math.ceil(n / 8);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Leads por dia">
    ${ticks.map((v) => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e2dc"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${dias.map((d, i) => { const x = L + i * slot + (slot - bw) / 2, h = y(0) - y(d.leads);
      return `${d.leads ? `<path d="M${x},${y(0)}v${-Math.max(h - 3, 0)}q0,-3 3,-3h${Math.max(bw - 6, 0)}q3,0 3,3v${Math.max(h - 3, 0)}z" fill="#ff6600"/>` : ""}
      ${i % cada === 0 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${dataBR(d.dia)}</text>` : ""}
      <rect x="${L + i * slot}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent" data-tip="${dataBR(d.dia)}\n${d.leads} leads · ${d.ganhos} viraram venda"/>`; }).join("")}
  </svg>`;
}

/* ====================== CAMPANHAS ====================== */
const somar = (linhas) => { const t = { gasto: 0, impressoes: 0, cliques: 0, conversas: 0, leads: 0, r2: 0, r3: 0, r4: 0, r5: 0, vendas: 0, faturamento: 0 }; for (const l of linhas) for (const k in t) t[k] += Number(l[k]) || 0; return t; };
async function vCampanhas() {
  const p = st.periodo;
  const ads = await q(sb.rpc("rel_campanhas", { p_inicio: p.ini, p_fim: p.fim, p_nivel: "anuncio" }));
  // monta a árvore campanha > conjunto > anúncio
  const camp = new Map();
  for (const a of ads) {
    if (!camp.has(a.campaign_id)) camp.set(a.campaign_id, { id: a.campaign_id, nome: a.campaign_nome, sem: a.sem_anuncio, conj: new Map(), ads: [] });
    const c = camp.get(a.campaign_id); c.ads.push(a);
    if (!c.conj.has(a.adset_id)) c.conj.set(a.adset_id, { id: a.adset_id, nome: a.adset_nome, ads: [] });
    c.conj.get(a.adset_id).ads.push(a);
  }
  const ord = st.camp.ordem;
  const valor = (t) => ({ cpl: div(t.gasto, t.leads) ?? 1e12, cac: div(t.gasto, t.vendas) ?? 1e12, roas: div(t.faturamento, t.gasto) ?? -1, conv: div(t.vendas, t.leads) ?? -1 }[ord] ?? t[ord]);
  const asc = ord === "cpl" || ord === "cac";
  const ordenar = (arr) => arr.sort((a, b) => (asc ? valor(a.t) - valor(b.t) : valor(b.t) - valor(a.t)));
  const lista = [...camp.values()].map((c) => ({ ...c, t: somar(c.ads) }));
  const pagas = ordenar(lista.filter((c) => !c.sem)), outras = lista.filter((c) => c.sem);
  const total = somar(pagas.flatMap((c) => c.ads));

  const cels = (t, pago = true) => `
    <td class="num">${pago ? brl(t.gasto) : "—"}</td>
    <td class="num">${pago ? int(t.conversas) : "—"}</td>
    <td class="num"><b>${int(t.leads)}</b></td>
    <td class="num">${pago && t.leads && t.gasto > 0 ? brl(t.gasto / t.leads, 2) : "—"}</td>
    <td class="num" data-tip="Leads que chegaram pelo menos até a Apresentação">${int(t.r4)} <span class="muted">(${pct(t.r4, t.leads)})</span></td>
    <td class="num"><b>${int(t.vendas)}</b></td>
    <td class="num">${pct(t.vendas, t.leads, 1)}</td>
    <td class="num">${brl(t.faturamento)}</td>
    <td class="num">${pago && t.vendas ? brl(t.gasto / t.vendas) : "—"}</td>
    <td class="num">${pago && t.gasto > 0 ? (t.faturamento / t.gasto).toFixed(1).replace(".", ",") + "x" : "—"}</td>`;
  const th = (k, n, tip) => `<th class="num sort" data-ord="${k}" ${tip ? `data-tip="${tip}"` : ""}>${n}${ord === k ? " ↓" : ""}</th>`;
  const linhas = [];
  for (const c of pagas) {
    const ab = st.camp.abertos.has(c.id);
    linhas.push(`<tr class="click" data-open="${esc(c.id)}"><td><span class="tgl">${ab ? "▾" : "▸"}</span><b>${esc(c.nome)}</b></td>${cels(c.t)}</tr>`);
    if (!ab) continue;
    for (const s of ordenar([...c.conj.values()].map((s) => ({ ...s, t: somar(s.ads) })))) {
      const k = c.id + "/" + s.id, ab2 = st.camp.abertos.has(k);
      linhas.push(`<tr class="click lvl1" data-open="${esc(k)}"><td><span class="tgl">${ab2 ? "▾" : "▸"}</span>${esc(s.nome)}</td>${cels(s.t)}</tr>`);
      if (ab2) for (const a of ordenar(s.ads.map((a) => ({ ...a, t: somar([a]) })))) linhas.push(`<tr class="lvl2"><td>${esc(a.ad_nome)}</td>${cels(a.t)}</tr>`);
    }
  }
  $("#main").innerHTML = `
  <div class="head"><div><h1>Campanhas</h1><div class="sub">Investimento da Meta cruzado com os leads e vendas do CRM. Clique em uma campanha para abrir conjuntos e anúncios.</div></div></div>
  ${filtrosHTML()}
  <div class="card"><div class="tw"><table>
    <tr><th>Campanha › Conjunto › Anúncio</th>${th("gasto", "Investimento")}${th("conversas", "Conversas", "Conversas iniciadas segundo a Meta")}${th("leads", "Leads", "Leads registrados no CRM vindos deste anúncio")}${th("cpl", "Custo/lead")}${th("r4", "Qualificados", "Chegaram até a Apresentação")}${th("vendas", "Vendas")}${th("conv", "Conversão")}${th("faturamento", "Faturamento")}${th("cac", "CAC")}${th("roas", "ROAS")}</tr>
    ${linhas.join("") || `<tr><td colspan="11" class="empty">Nenhum anúncio com investimento ou lead neste período. Confira a integração em Configurações.</td></tr>`}
    ${pagas.length ? `<tr class="total"><td>Total anúncios</td>${cels(total)}</tr>` : ""}
    ${outras.map((c) => `<tr><td>${esc(c.nome)}</td>${cels(c.t, false)}</tr>`).join("")}
  </table></div></div>
  <div class="sub">Vendas e faturamento são dos leads que chegaram no período — campanhas recentes ainda podem ter negociações em andamento.</div>`;
  ligarFiltros(() => vCampanhas().catch(falha));
  $$("[data-open]").forEach((tr) => (tr.onclick = () => { const k = tr.dataset.open; st.camp.abertos.has(k) ? st.camp.abertos.delete(k) : st.camp.abertos.add(k); vCampanhas().catch(falha); }));
  $$("[data-ord]").forEach((h) => (h.onclick = () => { st.camp.ordem = h.dataset.ord; vCampanhas().catch(falha); }));
}

  const pr = principais();
  const passos = [["leads", "r2"], ["r2", "r3"], ["r3", "r4"], ["r4", "r5"], ["r5", "vendas"]];
  const tot = {}; for (const k of ["leads", "r2", "r3", "r4", "r5", "vendas", "faturamento", "fu_entraram", "fu_ganhos", "sem_atendimento", "abertos"]) tot[k] = rows.reduce((s, r) => s + Number(r[k] || 0), 0);
  // célula divergente: compara a taxa da vendedora com a média da equipe naquela etapa
  const heat = (a, b, ta, tb) => {
    if (!b) return `<td class="heat muted">—</td>`;
    const v = a / b, m = tb ? ta / tb : v, d = (v - m) * 100, t = Math.min(Math.abs(d) / 15, 1);

    const seta = Math.abs(d) < 1 ? "" : d > 0 ? "▲" : "▼";
    return `<td class="heat" style="background:${bg}" data-tip="${a} de ${b} leads avançaram\nMédia da equipe: ${(m * 100).toFixed(0)}%\nDiferença: ${d > 0 ? "+" : ""}${d.toFixed(1).replace(".", ",")} p.p.">${(v * 100).toFixed(0)}%<small>${seta}</small></td>`;
  };
  $("#main").innerHTML = `
  <div class="head"><div><h1>Vendedoras</h1><div class="sub">Qualidade do atendimento: em qual etapa cada vendedora ganha ou perde o cliente, comparado à média da equipe.</div></div></div>
  ${filtrosHTML({ origem: true })}
  <div class="card">
    <h2>Taxa de passagem por etapa</h2>
    <div class="sub" style="margin-bottom:10px">Cada coluna mostra quantos % dos leads que chegaram a uma etapa avançaram para a seguinte.
      <span class="badge" style="background:rgba(255,102,0,.45);color:#0b0b0b">▲ acima da média</span> <span class="badge" style="background:rgba(11,11,11,.2);color:#0b0b0b">▼ abaixo da média</span></div>
    <div class="tw"><table>
      <tr><th>Vendedora</th><th class="num">Leads</th>${passos.map((_, i) => `<th class="num" data-tip="${esc(pr[i]?.nome)} → ${esc(pr[i + 1]?.nome)}">→ ${esc((pr[i + 1]?.nome || "").split(" ")[0])}</th>`).join("")}<th class="num">Vendas</th><th class="num" data-tip="Vendas ÷ leads recebidos">Lead → venda</th></tr>
      ${rows.map((r) => `<tr><td><b>${esc(r.nome)}</b></td><td class="num">${int(r.leads)}</td>${passos.map(([a, b]) => heat(r[b], r[a], tot[b], tot[a])).join("")}<td class="num">${int(r.vendas)}</td>${heat(r.vendas, r.leads, tot.vendas, tot.leads)}</tr>`).join("") || `<tr><td colspan="9" class="empty">Sem leads no período.</td></tr>`}
      ${rows.length > 1 ? `<tr class="total"><td>Equipe</td><td class="num">${int(tot.leads)}</td>${passos.map(([a, b]) => `<td class="num">${pct(tot[b], tot[a])}</td>`).join("")}<td class="num">${int(tot.vendas)}</td><td class="num">${pct(tot.vendas, tot.leads, 1)}</td></tr>` : ""}
    </table></div>
  </div>
  <div class="card">
    <h2>Resultado e rotina</h2><div class="sub" style="margin-bottom:10px">Volume vendido, tempo até assumir o atendimento, retornos e recuperação por follow-up.</div>
    <div class="tw"><table>
      <tr><th>Vendedora</th><th class="num">Faturamento</th><th class="num">Ticket médio</th><th class="num">Peças</th><th class="num" data-tip="Tempo mediano entre a chegada do lead e ela assumir o atendimento (tirar de Abordagem)">Tempo até atendimento</th><th class="num" data-tip="Retornos registrados no período e quantos clientes diferentes foram retornados">Retornos feitos</th><th class="num" data-tip="Leads em aberto com próximo contato vencido">Retornos atrasados</th><th class="num" data-tip="Leads que passaram por Follow-up e quantos fecharam">Follow-up → venda</th><th class="num" data-tip="Leads em Abordagem há mais de 2 horas sem atendimento (situação de agora)">Sem atendimento</th><th class="num">Em aberto</th><th class="num">Perdidos</th></tr>
      ${rows.map((r) => `<tr><td><b>${esc(r.nome)}</b></td><td class="num">${brl(r.faturamento)}</td><td class="num">${r.vendas ? brl(r.faturamento / r.vendas) : "—"}</td><td class="num">${int(r.pecas)}</td><td class="num">${minutos(r.atendimento_min)}</td><td class="num">${int(r.retornos)} <span class="muted">(${int(r.leads_retornados)} clientes)</span></td><td class="num">${r.retornos_atrasados > 0 ? `<span class="badge lost">${int(r.retornos_atrasados)}</span>` : "0"}</td><td class="num">${int(r.fu_ganhos)} de ${int(r.fu_entraram)} <span class="muted">(${pct(r.fu_ganhos, r.fu_entraram)})</span></td><td class="num">${r.sem_atendimento > 0 ? `<span class="badge lost">${int(r.sem_atendimento)}</span>` : "0"}</td><td class="num">${int(r.abertos)}</td><td class="num">${int(r.perdidos)}</td></tr>`).join("")}
    </table></div>
  </div>`;
  ligarFiltros(() => vVendedoras().catch(falha));
}

/* ====================== FUNIL (kanban) ====================== */
let arrastando = null;
async function vFunil() {
  let c = sb.from("leads").select("*").eq("status", "aberto").order("etapa_desde", { ascending: false }).limit(1000);
  let g = sb.from("leads").select("*").eq("status", "ganho").gte("atualizado_em", new Date(Date.now() - 30 * 864e5).toISOString()).order("atualizado_em", { ascending: false }).limit(60);
  if (st.vendedora) { c = c.eq("vendedora_id", st.vendedora); g = g.eq("vendedora_id", st.vendedora); }
  const [abertos, ganhos] = await Promise.all([q(c), q(g)]);
  const leads = [...abertos, ...ganhos], agora = Date.now();
  const cartao = (l) => {
    const dias = Math.max(0, Math.floor((agora - new Date(l.etapa_desde)) / 864e5));
    return `<div class="lead" draggable="true" data-id="${l.id}">
      <div class="n">${esc(l.nome || fone(l.telefone) || "Sem nome")}</div>
      <div class="m">${l.modalidade ? `<span>${esc(l.modalidade)}</span>` : ""}${l.quantidade_pecas ? `<span>${int(l.quantidade_pecas)} pç</span>` : ""}${l.valor_estimado ? `<span>${brl(l.valor_estimado)}</span>` : ""}</div>
      <div class="m">${l.meta_ad_id ? `<span class="badge ad">Anúncio</span>` : ""}${l.status === "ganho" ? `<span class="badge won">Venda</span>` : ""}${semAtendimento(l)}${retornoBadge(l)}${l.retornos_qtd ? `<span class="badge" data-tip="Último retorno: ${dataHora(l.ultimo_retorno_em)}">↩ ${l.retornos_qtd}</span>` : ""}<span class="muted">${dias ? dias + "d na etapa" : "hoje"}</span>${gestor() ? `<span class="muted">· ${esc(nomeVend(l.vendedora_id).split(" ")[0])}</span>` : ""}</div>
    </div>`;
  };
  $("#main").innerHTML = `
  <div class="head"><div><h1>Funil de vendas</h1><div class="sub">Arraste o lead para a etapa em que ele está. Soltar em Fechamento registra a venda.</div></div>
    <div class="row" style="flex:none">${gestor() ? `<select id="kv" style="flex:none"><option value="">Todas as vendedoras</option>${perfis.filter((x) => x.ativo).map((x) => `<option value="${x.id}" ${st.vendedora === x.id ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>` : ""}
    <button class="btn pri" id="novo" style="flex:none">+ Novo lead</button></div></div>
  <div class="kanban">${etapas.map((e) => { const ls = leads.filter((l) => l.etapa_id === e.id);
    return `<div class="col ${e.tipo === "recuperacao" ? "rec" : ""}" data-etapa="${e.id}"><h3><span>${esc(e.nome)}</span><span>${ls.length}</span></h3><div class="list">${ls.map(cartao).join("")}</div></div>`; }).join("")}</div>`;
  if ($("#kv")) $("#kv").onchange = (e) => { st.vendedora = e.target.value; vFunil().catch(falha); };
  $("#novo").onclick = () => abrirLead(null);
  $$(".lead").forEach((el) => {
    el.onclick = () => abrirLead(el.dataset.id);
    el.ondragstart = (ev) => { arrastando = el.dataset.id; ev.dataTransfer.setData("text/plain", arrastando); };
  });
  $$(".col").forEach((col) => {
    col.ondragover = (ev) => { ev.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = async (ev) => {
      ev.preventDefault(); col.classList.remove("over");
      const l = leads.find((x) => x.id === arrastando), para = Number(col.dataset.etapa);
      if (!l || l.etapa_id === para) return;
      try { await moverLead(l, para); } catch (e) { falha(e); }
    };
  });
}
async function moverLead(l, para) {
  if (para === 7) return abrirVenda(l);
  if (l.status === "ganho") return toast("Este lead já tem venda registrada. Abra o lead para ajustar.", true);
  await q(sb.from("leads").update({ etapa_id: para }).eq("id", l.id));
  toast("Lead movido para " + etapa(para).nome);
  rota();
}

/* ====================== LEADS (lista) ====================== */
async function vLeads() {
  const f = st.leads, POR = 50;
  const montar = (sel, opts) => {
    let c = sb.from("leads").select(sel, opts);
    if (f.status) c = c.eq("status", f.status);
    if (f.etapa) c = c.eq("etapa_id", Number(f.etapa));
    if (f.vendedora) c = c.eq("vendedora_id", f.vendedora);
    if (f.busca.trim()) { const b = f.busca.trim().replace(/[,()%*\\]/g, " "); c = c.or(`nome.ilike.%${b}%,telefone.ilike.%${b.replace(/\D/g, "") || b}%`); }
    return c.order("criado_em", { ascending: false });
  };
  const { data: leads, count } = await q(montar("*", { count: "exact" }).range(f.pagina * POR, f.pagina * POR + POR - 1));
  const stBadge = (l) => l.status === "ganho" ? `<span class="badge won">Venda</span>` : l.status === "perdido" ? `<span class="badge lost">Perdido</span>` : `<span class="badge">Aberto</span>`;
  $("#main").innerHTML = `
  <div class="head"><div><h1>Leads</h1><div class="sub">${int(count)} leads encontrados.</div></div>
    <div><button class="btn" id="csv">Exportar CSV</button> <button class="btn pri" id="novo">+ Novo lead</button></div></div>
  <div class="filters">
    <input id="lb" placeholder="Buscar por nome ou telefone" value="${esc(f.busca)}" style="min-width:230px">
    <select id="ls"><option value="">Todos os status</option><option value="aberto">Aberto</option><option value="ganho">Venda</option><option value="perdido">Perdido</option></select>
    <select id="le"><option value="">Todas as etapas</option>${etapas.map((e) => `<option value="${e.id}">${esc(e.nome)}</option>`).join("")}</select>
    ${gestor() ? `<select id="lv"><option value="">Todas as vendedoras</option>${perfis.map((x) => `<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select>` : ""}
  </div>
  <div class="card" style="padding:4px 6px"><div class="tw"><table>
    <tr><th>Lead</th><th>Telefone</th><th>Etapa</th><th>Status</th><th>Origem</th><th>Vendedora</th><th class="num">Retornos</th><th>Próximo contato</th><th>Chegou em</th></tr>
    ${leads.map((l) => `<tr class="click" data-id="${l.id}"><td><b>${esc(l.nome || "Sem nome")}</b></td><td>${esc(fone(l.telefone))}</td><td>${esc(etapa(l.etapa_id)?.nome)}</td><td>${stBadge(l)}</td><td>${l.meta_ad_id ? `<span class="badge ad" data-tip="${esc(l.anuncio_titulo || "Anúncio " + l.meta_ad_id)}">Anúncio</span>` : esc(ORIGENS[l.origem])}</td><td>${esc(nomeVend(l.vendedora_id))}</td><td class="num" ${l.ultimo_retorno_em ? `data-tip="Último retorno: ${dataHora(l.ultimo_retorno_em)}"` : ""}>${int(l.retornos_qtd)}</td><td>${retornoBadge(l) || (l.proximo_contato && l.status === "aberto" ? dataBR(l.proximo_contato) : "—")}</td><td>${dataHora(l.criado_em)}</td></tr>`).join("") || `<tr><td colspan="9" class="empty">Nenhum lead encontrado.</td></tr>`}
  </table></div></div>
  <div style="display:flex;gap:8px;align-items:center;justify-content:flex-end">
    <span class="sub">Página ${f.pagina + 1} de ${Math.max(1, Math.ceil(count / POR))}</span>
    <button class="btn sm" id="pa" ${f.pagina ? "" : "disabled"}>Anterior</button><button class="btn sm" id="pp" ${(f.pagina + 1) * POR < count ? "" : "disabled"}>Próxima</button></div>`;
  $("#ls").value = f.status; $("#le").value = f.etapa; if ($("#lv")) $("#lv").value = f.vendedora;
  const re = () => vLeads().catch(falha);
  let t; $("#lb").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { f.busca = e.target.value; f.pagina = 0; re().then(() => { const i = $("#lb"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 350); };
  $("#ls").onchange = (e) => { f.status = e.target.value; f.pagina = 0; re(); };
  $("#le").onchange = (e) => { f.etapa = e.target.value; f.pagina = 0; re(); };
  if ($("#lv")) $("#lv").onchange = (e) => { f.vendedora = e.target.value; f.pagina = 0; re(); };
  $("#pa").onclick = () => { f.pagina--; re(); }; $("#pp").onclick = () => { f.pagina++; re(); };
  $("#novo").onclick = () => abrirLead(null);
  $$("tr[data-id]").forEach((tr) => (tr.onclick = () => abrirLead(tr.dataset.id)));
  $("#csv").onclick = async () => {
    try {
      const todos = await q(montar("*").limit(5000));
      const cols = ["nome", "telefone", "etapa", "status", "motivo_perda", "origem", "meta_ad_id", "vendedora", "modalidade", "quantidade_pecas", "valor_estimado", "retornos_qtd", "ultimo_retorno_em", "proximo_contato", "criado_em"];
      const cel = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [cols.join(";"), ...todos.map((l) => cols.map((k) => cel(k === "etapa" ? etapa(l.etapa_id)?.nome : k === "vendedora" ? nomeVend(l.vendedora_id) : k === "origem" ? ORIGENS[l.origem] : l[k])).join(";"))].join("\r\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `leads-${hojeBR()}.csv`; a.click();
    } catch (e) { falha(e); }
  };
}

/* ====================== modais ====================== */
function modal(html, cls = "") {
  $("#modal").innerHTML = `<div class="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = $(".ov"); ov.onmousedown = (e) => { if (e.target === ov) fechar(); };
  $$("[data-fechar]", ov).forEach((b) => (b.onclick = fechar));
}
const fechar = () => ($("#modal").innerHTML = "");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fechar(); });

async function abrirLead(id, aba) {
  try {
    const novo = !id;
    const l = novo ? { etapa_id: 1, status: "aberto", origem: "organico", vendedora_id: eu.id } : await q(sb.from("leads").select("*").eq("id", id).single());
    const [hist, vendas, msgs, ad, rets] = novo ? [[], [], [], null, []] : await Promise.all([
      q(sb.from("lead_historico").select("*").eq("lead_id", id).order("em", { ascending: false }).limit(50)),
      q(sb.from("vendas").select("*").eq("lead_id", id).order("data", { ascending: false })),
      q(sb.from("mensagens").select("*").eq("lead_id", id).order("em", { ascending: false }).limit(60)),
      l.meta_ad_id ? q(sb.from("meta_anuncios").select("*").eq("ad_id", l.meta_ad_id).maybeSingle()) : null,
      q(sb.from("retornos").select("*").eq("lead_id", id).order("em", { ascending: false }).limit(100)),
    ]);
    const sel = (id_, ops, v) => `<select id="${id_}">${ops.map(([k, n]) => `<option value="${esc(k)}" ${String(v ?? "") === String(k) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    modal(`
    <div class="mh"><div><h1>${novo ? "Novo lead" : esc(l.nome || "Lead sem nome")}</h1>
      ${novo ? "" : `<div class="sub">${l.status === "ganho" ? `<span class="badge won">Venda</span>` : l.status === "perdido" ? `<span class="badge lost">Perdido · ${esc(l.motivo_perda || "sem motivo")}</span>` : `<span class="badge">Aberto</span>`} · chegou em ${dataHora(l.criado_em)}${l.telefone ? ` · <a href="https://wa.me/${esc(l.telefone)}" target="_blank" rel="noopener">Abrir no WhatsApp</a>` : ""}</div>`}</div>
      <button class="x" data-fechar aria-label="Fechar">×</button></div>
    ${l.meta_ad_id ? `<div class="note" style="background:var(--accent-soft);border-color:#ffd2b0"><b>Veio de anúncio</b> — ${ad ? `${esc(ad.campaign_nome)} › ${esc(ad.adset_nome)} › ${esc(ad.ad_nome)}` : `${esc(l.anuncio_titulo || "")} (ID ${esc(l.meta_ad_id)}; o nome aparece após a próxima sincronização)`}${l.codigo_origem ? ` · código <b>${esc(l.codigo_origem)}</b>` : ""}</div>`
      : l.codigo_origem ? `<div class="note">Chegou com o código <b>${esc(l.codigo_origem)}</b>, que ainda não está cadastrado em Configurações → Códigos de anúncio.</div>` : ""}
    <div class="row"><div class="field"><label>Nome</label><input id="m_nome" value="${esc(l.nome)}"></div>
      <div class="field"><label>WhatsApp (com DDD)</label><input id="m_tel" value="${esc(l.telefone)}" inputmode="tel"></div></div>
    <div class="row"><div class="field"><label>Etapa</label>${sel("m_etapa", etapas.filter((e) => e.id !== 7 || l.status === "ganho").map((e) => [e.id, e.nome]), l.etapa_id)}</div>
      <div class="field"><label>Vendedora</label>${gestor() ? sel("m_vend", [["", "Sem vendedora"], ...perfis.filter((p) => p.ativo || p.id === l.vendedora_id).map((p) => [p.id, p.nome])], l.vendedora_id) : `<input disabled value="${esc(nomeVend(l.vendedora_id))}">`}</div>
      <div class="field"><label>Origem</label>${sel("m_origem", Object.entries(ORIGENS), l.origem)}</div></div>
    <div class="row"><div class="field"><label>Modalidade / esporte</label><input id="m_mod" value="${esc(l.modalidade)}"></div>
      <div class="field"><label>Quantidade de peças</label><input id="m_qtd" type="number" min="0" value="${esc(l.quantidade_pecas)}"></div>
      <div class="field"><label>Valor estimado (R$)</label><input id="m_val" type="number" min="0" step="0.01" value="${esc(l.valor_estimado)}"></div>
      <div class="field"><label>Próximo contato</label><input id="m_prox" type="date" value="${esc(l.proximo_contato)}"></div></div>
    <div class="field"><label>Observações</label><textarea id="m_obs" rows="2">${esc(l.observacoes)}</textarea></div>
    ${novo ? "" : `<div class="tabs"><button data-tab="t_ret">Retornos (${rets.length})</button><button class="on" data-tab="t_hist">Histórico</button><button data-tab="t_msg">Mensagens (${msgs.length})</button><button data-tab="t_ven">Vendas (${vendas.length})</button></div>
    <div id="t_ret" class="hide">
      <div class="row" style="align-items:flex-end">
        <div class="field"><label>Canal</label>${sel("r_canal", Object.entries(CANAIS), "whatsapp")}</div>
        <div class="field"><label>Resultado</label>${sel("r_res", Object.entries(RESULTADOS), "respondeu")}</div>
        <div class="field"><label>Agendar próximo contato</label><input id="r_prox" type="date"></div></div>
      <div class="row" style="align-items:flex-end"><div class="field" style="flex:4"><label>O que foi tratado</label><input id="r_obs" placeholder="ex.: reenviei o orçamento, cliente vai aprovar a arte"></div>
        <div class="field" style="flex:1"><button class="btn pri" id="r_ok" style="width:100%">Registrar retorno</button></div></div>
      <div style="max-height:220px;overflow-y:auto">${rets.map((r) => `<div class="sub" style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)"><span>${dataHora(r.em)} — <b>${esc(CANAIS[r.canal] || r.canal)}</b> · ${esc(RESULTADOS[r.resultado] || r.resultado)}${r.observacao ? " · " + esc(r.observacao) : ""}<span class="muted"> · ${esc(nomeVend(r.usuario_id))}</span></span>${gestor() ? `<button class="btn sm danger" data-delret="${r.id}">Excluir</button>` : ""}</div>`).join("") || `<div class="empty">Nenhum retorno registrado para este cliente.</div>`}</div>
    </div>
    <div id="t_hist">${hist.map((h) => `<div class="sub">${dataHora(h.em)} — ${h.de_etapa_id ? esc(etapa(h.de_etapa_id)?.nome) + " → " : "Entrou em "}<b>${esc(etapa(h.para_etapa_id)?.nome)}</b>${h.usuario_id ? " · " + esc(nomeVend(h.usuario_id)) : ""}</div>`).join("")}</div>
    <div id="t_msg" class="hide" style="max-height:260px;overflow-y:auto">${msgs.slice().reverse().map((m) => `<div class="msg ${m.direcao === "saida" ? "out" : ""}">${esc(m.texto || "[" + (m.tipo || "mídia") + "]")}<small>${dataHora(m.em)}</small></div>`).join("") || `<div class="empty">Nenhuma mensagem registrada.</div>`}</div>
    <div id="t_ven" class="hide">${vendas.map((v) => `<div class="sub" style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${dataBR(v.data)}/${v.data.slice(0, 4)} — <b>${brl(v.valor, 2)}</b>${v.quantidade_pecas ? " · " + int(v.quantidade_pecas) + " peças" : ""}${v.observacao ? " · " + esc(v.observacao) : ""}</span>${gestor() ? `<button class="btn sm danger" data-delvenda="${v.id}">Excluir</button>` : ""}</div>`).join("") || `<div class="empty">Nenhuma venda registrada.</div>`}</div>`}
    <div class="actions">
      ${!novo && gestor() ? `<button class="btn danger" id="m_del" style="margin-right:auto">Excluir lead</button>` : ""}
      ${!novo && l.status !== "perdido" ? `<button class="btn danger" id="m_perd">Marcar como perdido</button>` : ""}
      ${!novo && l.status === "perdido" ? `<button class="btn" id="m_reab">Reabrir (Reativação)</button>` : ""}
      ${!novo ? `<button class="btn good" id="m_venda">Registrar venda</button>` : ""}
      <button class="btn pri" id="m_salvar">Salvar</button></div>`);
    $$("[data-tab]").forEach((b) => (b.onclick = () => { $$("[data-tab]").forEach((x) => { x.classList.toggle("on", x === b); $("#" + x.dataset.tab).classList.toggle("hide", x !== b); }); }));
    if (aba && $(`[data-tab="${aba}"]`)) $(`[data-tab="${aba}"]`).click();
    if ($("#r_ok")) $("#r_ok").onclick = async () => {
      try {
        await q(sb.from("retornos").insert({ lead_id: id, canal: $("#r_canal").value, resultado: $("#r_res").value, observacao: $("#r_obs").value.trim() || null }));
        // agenda o próximo contato; sem nova data, um agendamento já vencido é dado como cumprido
        const prox = $("#r_prox").value;
        if (prox || (l.proximo_contato && l.proximo_contato <= hojeBR())) await q(sb.from("leads").update({ proximo_contato: prox || null }).eq("id", id));
        toast("Retorno registrado"); rota(); abrirLead(id, "t_ret");
      } catch (e) { falha(e); }
    };
    $$("[data-delret]").forEach((b) => (b.onclick = async () => { try { await q(sb.from("retornos").delete().eq("id", b.dataset.delret)); toast("Retorno excluído"); rota(); abrirLead(id, "t_ret"); } catch (e) { falha(e); } }));
    const num = (s) => ($(s).value === "" ? null : Number($(s).value));
    $("#m_salvar").onclick = async () => {
      const etapaSel = Number($("#m_etapa").value);
      const d = { nome: $("#m_nome").value.trim() || null, telefone: $("#m_tel").value.trim() || null, etapa_id: etapaSel, origem: $("#m_origem").value,
        modalidade: $("#m_mod").value.trim() || null, quantidade_pecas: num("#m_qtd"), valor_estimado: num("#m_val"), proximo_contato: $("#m_prox").value || null, observacoes: $("#m_obs").value.trim() || null };
      if (gestor()) d.vendedora_id = $("#m_vend").value || null; else if (novo) d.vendedora_id = eu.id;
      try {
        if (novo) await q(sb.from("leads").insert(d)); else await q(sb.from("leads").update(d).eq("id", id));
        fechar(); toast("Lead salvo"); rota();
      } catch (e) { falha(e.code === "23505" ? new Error("Já existe um lead com este telefone.") : e); }
    };
    if ($("#m_venda")) $("#m_venda").onclick = () => abrirVenda(l);
    if ($("#m_perd")) $("#m_perd").onclick = () => abrirPerda(l);
    if ($("#m_reab")) $("#m_reab").onclick = async () => { try { await q(sb.from("leads").update({ etapa_id: 8 }).eq("id", id)); fechar(); toast("Lead reaberto em Reativação"); rota(); } catch (e) { falha(e); } };
    if ($("#m_del")) $("#m_del").onclick = () => confirmar("Excluir este lead e todo o histórico dele?", async () => { await q(sb.from("leads").delete().eq("id", id)); toast("Lead excluído"); rota(); });
    $$("[data-delvenda]").forEach((b) => (b.onclick = () => confirmar("Excluir esta venda? O lead volta para Negociação.", async () => { await q(sb.from("vendas").delete().eq("id", b.dataset.delvenda)); toast("Venda excluída"); rota(); })));
  } catch (e) { falha(e); }
}

function confirmar(texto, acao) {
  modal(`<div class="mh"><h1>Confirmar</h1><button class="x" data-fechar>×</button></div><p>${esc(texto)}</p>
    <div class="actions"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="c_ok">Confirmar</button></div>`, "sm");
  $("#c_ok").onclick = async () => { try { await acao(); fechar(); } catch (e) { falha(e); } };
}

function abrirVenda(l) {
  modal(`<div class="mh"><div><h1>Registrar venda</h1><div class="sub">${esc(l.nome || fone(l.telefone))}</div></div><button class="x" data-fechar>×</button></div>
    <div class="row"><div class="field"><label>Valor da venda (R$)</label><input id="v_val" type="number" min="0" step="0.01" value="${esc(l.valor_estimado)}"></div>
    <div class="field"><label>Quantidade de peças</label><input id="v_qtd" type="number" min="0" value="${esc(l.quantidade_pecas)}"></div></div>
    <div class="field"><label>Data da venda</label><input id="v_data" type="date" value="${hojeBR()}"></div>
    <div class="field"><label>Observação</label><input id="v_obs"></div>
    <div class="actions"><button class="btn" data-fechar>Cancelar</button><button class="btn good" id="v_ok">Confirmar venda</button></div>`, "sm");
  $("#v_ok").onclick = async () => {
    const valor = Number($("#v_val").value);
    if (!(valor > 0)) return toast("Informe o valor da venda.", true);
    try {
      await q(sb.from("vendas").insert({ lead_id: l.id, valor, quantidade_pecas: $("#v_qtd").value === "" ? null : Number($("#v_qtd").value), data: $("#v_data").value || hojeBR(), observacao: $("#v_obs").value.trim() || null }));
      fechar(); toast("Venda registrada"); rota();
    } catch (e) { falha(e); }
  };
}

function abrirPerda(l) {
  modal(`<div class="mh"><div><h1>Marcar como perdido</h1><div class="sub">${esc(l.nome || fone(l.telefone))} · etapa ${esc(etapa(l.etapa_id)?.nome)}</div></div><button class="x" data-fechar>×</button></div>
    <div class="field"><label>Motivo</label><select id="p_mot">${MOTIVOS.map((m) => `<option>${m}</option>`).join("")}</select></div>
    <div class="field hide" id="p_outro_w"><label>Qual?</label><input id="p_outro"></div>
    <div class="actions"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="p_ok">Confirmar</button></div>`, "sm");
  $("#p_mot").onchange = (e) => $("#p_outro_w").classList.toggle("hide", e.target.value !== "Outro");
  $("#p_ok").onclick = async () => {
    const m = $("#p_mot").value === "Outro" ? $("#p_outro").value.trim() || "Outro" : $("#p_mot").value;
    try { await q(sb.from("leads").update({ status: "perdido", motivo_perda: m }).eq("id", l.id)); fechar(); toast("Lead marcado como perdido"); rota(); } catch (e) { falha(e); }
  };
}

/* ====================== CONFIGURAÇÕES ====================== */
async function vConfig() {
  const [cfgRows, seg, eventos, codigos, anuncios, leadsCod, recentes] = await Promise.all([q(sb.from("config").select("*")), q(sb.rpc("crm_segredos_definidos")), q(sb.from("webhook_eventos").select("id,recebido_em,formato,resultado").order("recebido_em", { ascending: false }).limit(8)),
    q(sb.from("anuncio_codigos").select("*").order("codigo")), todos(() => sb.from("meta_anuncios").select("ad_id,ad_nome,adset_id,adset_nome,campaign_id,campaign_nome").eq("demo", false).order("ad_id", { ascending: false })),
    todos(() => sb.from("leads").select("codigo_origem,meta_ad_id").gte("codigo_origem", "").order("codigo_origem")),
    todos(() => sb.from("meta_insights").select("ad_id,gasto").gte("data", addDias(hojeBR(), -3)).order("ad_id"))]);
  perfis = await q(sb.from("perfis").select("*").order("nome"));
  const cfg = Object.fromEntries(cfgRows.map((r) => [r.chave, r.valor]));
  const base = sb.supabaseUrl || CFG.url;
  const hook = `${base}/functions/v1/whatsapp-webhook?token=${cfg.webhook_token || ""}`;
  const temDemo = perfis.some((p) => p.demo);
  // códigos de anúncio: leads por código e códigos que chegaram sem cadastro
  const porCodigo = {};
  for (const l of leadsCod) if (l.codigo_origem) porCodigo[l.codigo_origem] = (porCodigo[l.codigo_origem] || 0) + 1;
  const pendentes = Object.keys(porCodigo).filter((c) => !codigos.some((x) => x.codigo === c)).sort();
  const nomeAd = (id) => { const a = anuncios.find((x) => x.ad_id === id); return a ? `${a.campaign_nome} › ${a.adset_nome} › ${a.ad_nome}` : `Anúncio ${id}`; };
  let numProx = 1;
  while (codigos.some((x) => x.codigo === "MS" + String(numProx).padStart(2, "0"))) numProx++;
  const proximo = "MS" + String(numProx).padStart(2, "0");
  const ativos = new Set(recentes.filter((r) => Number(r.gasto) > 0).map((r) => r.ad_id));
  const grupos = {};
  for (const a of anuncios) {
    const c = (ativos.has(a.ad_id) ? "Em veiculação · " : "Parados · ") + (a.campaign_nome || "Sem campanha");
    if (!grupos[c]) grupos[c] = [];
    grupos[c].push(a);
  }
  const ordemGrupos = Object.keys(grupos).sort((x, y) => (y.startsWith("Em") - x.startsWith("Em")) || x.localeCompare(y, "pt-BR"));
  const opcoes = (sel) => ordemGrupos.map((c) => `<optgroup label="${esc(c)}">${grupos[c].map((a) => `<option value="${esc(a.ad_id)}" ${a.ad_id === sel ? "selected" : ""}>${esc(a.adset_nome)} › ${esc(a.ad_nome)}</option>`).join("")}</optgroup>`).join("")
    + (sel && !anuncios.some((a) => a.ad_id === sel) ? `<option value="${esc(sel)}" selected>Anúncio ${esc(sel)}</option>` : "");
  const parados = codigos.filter((c) => c.ativo && !ativos.has(c.meta_ad_id)).length;
  // IDs de anúncio da Meta crescem com o tempo: o maior ID da campanha indica a campanha mais recente
  const maisNovo = (x, y) => (x.length - y.length) || (x < y ? -1 : x > y ? 1 : 0);
  const recCamp = {};
  for (const a of anuncios) { const k = a.campaign_id || a.campaign_nome; if (!recCamp[k] || maisNovo(a.ad_id, recCamp[k]) > 0) recCamp[k] = a.ad_id; }
  const listaBusca = anuncios.slice().sort((a, b) => maisNovo(recCamp[b.campaign_id || b.campaign_nome], recCamp[a.campaign_id || a.campaign_nome])
    || String(a.campaign_nome).localeCompare(String(b.campaign_nome), "pt-BR") || String(a.adset_nome).localeCompare(String(b.adset_nome), "pt-BR")
    || String(a.ad_nome).localeCompare(String(b.ad_nome), "pt-BR"));
  const semAcento = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const escolherAnuncio = (titulo, atual, aoEscolher) => {
    modal(`<div class="mh"><div><h1>${esc(titulo)}</h1><div class="sub">Busque pelo nome da campanha, do conjunto ou do anúncio. As campanhas mais recentes aparecem primeiro.</div></div><button class="x" data-fechar aria-label="Fechar">×</button></div>
      <input id="pk_q" placeholder="Ex.: ENVOLVIMENTO 7 e 15D, AD03, regatas…" style="width:100%" autocomplete="off" aria-label="Buscar anúncio">
      <div id="pk_info" class="sub" style="margin:8px 0"></div><div id="pk_lista" style="max-height:55vh;overflow-y:auto"></div>`);
    const desenhar = () => {
      const termos = semAcento($("#pk_q").value).split(/\s+/).filter(Boolean);
      const achados = listaBusca.filter((a) => { const t = semAcento(`${a.campaign_nome} ${a.adset_nome} ${a.ad_nome} ${a.ad_id}`); return termos.every((x) => t.includes(x)); });
      const mostra = achados.slice(0, 150);
      $("#pk_info").textContent = achados.length > mostra.length ? `Mostrando ${mostra.length} de ${achados.length} anúncios. Digite mais para refinar.` : `${achados.length} anúncio${achados.length === 1 ? "" : "s"}.`;
      let html = "", ultima = null;
      for (const a of mostra) {
        if (a.campaign_nome !== ultima) { html += `<div style="font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 4px">${esc(a.campaign_nome || "Sem campanha")}</div>`; ultima = a.campaign_nome; }
        html += `<button class="btn" data-pk="${esc(a.ad_id)}" style="display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;margin:3px 0;${a.ad_id === atual ? "border-color:var(--accent);background:var(--accent-soft)" : ""}"><span>${esc(a.adset_nome)} › <b>${esc(a.ad_nome)}</b></span>${ativos.has(a.ad_id) ? `<span class="badge won">em veiculação</span>` : ""}</button>`;
      }
      $("#pk_lista").innerHTML = html || `<div class="empty">Nenhum anúncio encontrado. Se a campanha é nova, clique em “Sincronizar agora” no quadro Meta Ads.</div>`;
      $$("[data-pk]").forEach((b) => (b.onclick = () => { fechar(); aoEscolher(b.dataset.pk); }));
    };
    $("#pk_q").oninput = desenhar; desenhar(); $("#pk_q").focus();
  };
  $("#main").innerHTML = `
  <div class="head"><div><h1>Configurações</h1><div class="sub">Equipe, integrações com WhatsApp e Meta Ads.</div></div></div>

  <div class="card"><div class="head" style="margin-bottom:8px"><div><h2>Equipe</h2><div class="sub">Quem acessa o CRM e quem entra no rodízio de novos leads.</div></div><button class="btn pri" id="eq_novo">+ Novo usuário</button></div>
    <div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th data-tip="Número, phone_number_id ou nome da instância de WhatsApp que esta vendedora atende. Mensagens recebidas nesse canal vão direto para ela.">Canal WhatsApp</th><th>Recebe leads</th><th>Ativo</th><th></th></tr>
    ${perfis.map((p) => `<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.email || "—")}</td><td>${p.papel === "gestor" ? "Gestor" : "Vendedora"}</td>
      <td>${p.demo ? "—" : `<input data-canal="${p.id}" value="${esc(p.canal_whatsapp)}" placeholder="opcional" style="width:150px">`}</td>
      <td>${p.demo || p.papel !== "vendedora" ? "—" : `<input type="checkbox" data-recebe="${p.id}" ${p.recebe_leads ? "checked" : ""} aria-label="Recebe leads">`}</td>
      <td>${p.demo ? "demo" : `<input type="checkbox" data-ativo="${p.id}" ${p.ativo ? "checked" : ""} ${p.id === eu.id ? "disabled" : ""} aria-label="Ativo">`}</td>
      <td class="num">${p.demo ? "" : `<button class="btn sm" data-senha="${p.id}">Nova senha</button> ${p.id !== eu.id ? `<button class="btn sm danger" data-rem="${p.id}">Remover</button>` : ""}`}</td></tr>`).join("")}
    </table></div></div>

  <div class="card"><h2>WhatsApp</h2><div class="sub" style="margin-bottom:10px">Cadastre este endereço como webhook de mensagens no seu provedor de WhatsApp (API oficial da Meta, Evolution API, Z-API ou via Make). Cada mensagem cria ou atualiza o lead e grava o anúncio de origem.</div>
    <label>URL do webhook</label><div class="code" id="hook">${esc(hook)}</div>
    <div style="margin:8px 0 14px"><button class="btn sm" id="hook_cp">Copiar</button> <span class="sub">Na API oficial da Meta, use como "Verify token": <span class="code" style="display:inline;padding:2px 6px">${esc(cfg.webhook_token)}</span></span></div>
    <h2>Últimos eventos recebidos</h2>
    <div class="tw"><table>${eventos.map((e) => `<tr><td>${dataHora(e.recebido_em)}</td><td>${esc(e.formato)}</td><td class="sub">${esc(e.resultado)}</td></tr>`).join("") || `<tr><td class="empty">Nenhum evento recebido ainda.</td></tr>`}</table></div></div>

  <div class="card"><h2>Meta Ads</h2><div class="sub" style="margin-bottom:10px">Busca investimento, conversas e nomes de campanha, conjunto e anúncio. Atualiza sozinho a cada hora.</div>
    <div class="row"><div class="field"><label>ID da conta de anúncios</label><input id="mt_conta" value="${esc(cfg.meta_ad_account_id)}" placeholder="ex.: 123456789012345"></div>
    <div class="field"><label>Token de acesso (permissão ads_read) ${seg.meta_token ? "— já salvo" : ""}</label><input id="mt_token" type="password" placeholder="${seg.meta_token ? "•••••••• (deixe vazio para manter)" : "cole o token aqui"}" autocomplete="off"></div>
    <div class="field"><label>Versão da API</label><input id="mt_ver" value="${esc(cfg.meta_api_version || "v23.0")}"></div></div>
    <div class="sub" style="margin-bottom:10px">Última sincronização: <b>${cfg.meta_ultimo_sync ? dataHora(cfg.meta_ultimo_sync) : "nunca"}</b>${cfg.meta_ultimo_erro ? ` · <span style="color:var(--crit)">Erro: ${esc(cfg.meta_ultimo_erro)}</span>` : ""}</div>
    <button class="btn pri" id="mt_salvar">Salvar</button> <button class="btn" id="mt_sync">Sincronizar agora (14 dias)</button> <button class="btn" id="mt_sync90">Importar 90 dias</button></div>

  <div class="card"><h2>Códigos de anúncio</h2>
    <div class="sub" style="margin-bottom:10px">Coloque um código curto na mensagem pronta de cada anúncio (ex.: “Olá! Quero um orçamento <b>${proximo}</b>”). O BotConversa envia o código e o CRM liga o lead ao anúncio certo. Leads que chegarem com um código ainda não cadastrado são ligados assim que você cadastrar.<br>
    <b>Novo ciclo de campanhas:</b> desligue os anúncios antigos e troque, na tabela, o anúncio de cada código. Os leads que já chegaram continuam no anúncio antigo.</div>
    ${parados && Object.keys(grupos).some((g) => g.startsWith("Em")) ? `<div class="note">${parados} código${parados > 1 ? "s apontam" : " aponta"} para anúncio${parados > 1 ? "s" : ""} sem investimento nos últimos 3 dias (marcados como <b>parado</b>). Se começou um ciclo novo, troque o anúncio deles.</div>` : ""}
    ${anuncios.length ? `<div class="row" style="align-items:flex-end">
      <div class="field" style="flex:0 0 130px;min-width:110px"><label>Código</label><input id="cd_cod" value="${proximo}" maxlength="20" autocomplete="off"></div>
      <div class="field" style="flex:5"><label>Anúncio</label><input type="hidden" id="cd_ad"><button class="btn" id="cd_pick" style="width:100%;text-align:left">🔍 Buscar campanha, conjunto ou anúncio…</button></div>
      <div class="field" style="flex:0 0 120px;min-width:110px"><button class="btn pri" id="cd_add" style="width:100%">Adicionar</button></div></div>`
    : `<div class="note">Sincronize o Meta Ads (acima) para escolher os anúncios.</div>`}
    ${pendentes.length ? `<div class="note">Códigos recebidos que ainda não foram cadastrados: ${pendentes.map((c) => `<a href="#" data-pend="${esc(c)}"><b>${esc(c)}</b></a> (${porCodigo[c]} lead${porCodigo[c] > 1 ? "s" : ""})`).join(" · ")}. Clique para cadastrar.</div>` : ""}
    <div class="tw"><table><tr><th>Código</th><th>Campanha › Conjunto › Anúncio</th><th class="num" data-tip="Leads que chegaram com este código, somando todos os ciclos">Leads (total)</th><th>Ativo</th><th></th></tr>
    ${codigos.map((c) => `<tr><td><b>${esc(c.codigo)}</b></td><td><button class="btn sm" data-cdad="${esc(c.codigo)}" data-atual="${esc(c.meta_ad_id)}">🔍 Trocar anúncio</button>
      ${c.ativo && !ativos.has(c.meta_ad_id) && Object.keys(grupos).some((g) => g.startsWith("Em")) ? ` <span class="badge wait" data-tip="Sem investimento nos últimos 3 dias">parado</span>` : ""}<div class="sub">${esc(nomeAd(c.meta_ad_id))}</div></td><td class="num">${int(porCodigo[c.codigo] || 0)}</td>
      <td><input type="checkbox" data-cdativo="${esc(c.codigo)}" ${c.ativo ? "checked" : ""} aria-label="Ativo"></td><td class="num"><button class="btn sm danger" data-cddel="${esc(c.codigo)}">Excluir</button></td></tr>`).join("") || `<tr><td colspan="5" class="empty">Nenhum código cadastrado.</td></tr>`}
    </table></div></div>

  <div class="card"><h2>Dados de demonstração</h2><div class="sub" style="margin-bottom:10px">Gera leads, vendas e campanhas fictícios para você conhecer os relatórios. Ficam separados dos dados reais e podem ser removidos a qualquer momento.</div>
    <button class="btn" id="demo_on">${temDemo ? "Gerar novamente" : "Carregar dados de demonstração"}</button> ${temDemo ? `<button class="btn danger" id="demo_off">Remover dados de demonstração</button>` : ""}</div>`;

  const re = () => vConfig().catch(falha);
  const upd = async (id, d) => { try { await q(sb.from("perfis").update(d).eq("id", id)); toast("Salvo"); } catch (e) { falha(e); re(); } };
  $$("[data-canal]").forEach((i) => (i.onchange = () => upd(i.dataset.canal, { canal_whatsapp: i.value.trim() || null })));
  $$("[data-recebe]").forEach((i) => (i.onchange = () => upd(i.dataset.recebe, { recebe_leads: i.checked })));
  $$("[data-ativo]").forEach((i) => (i.onchange = () => upd(i.dataset.ativo, { ativo: i.checked })));
  $$("[data-rem]").forEach((b) => (b.onclick = () => confirmar("Remover este usuário? Os leads dele ficam sem vendedora.", async () => { await fn("equipe", { acao: "remover", id: b.dataset.rem }); toast("Usuário removido"); re(); })));
  $$("[data-senha]").forEach((b) => (b.onclick = () => {
    modal(`<div class="mh"><h1>Nova senha</h1><button class="x" data-fechar>×</button></div><div class="field"><label>Senha (mínimo 8 caracteres)</label><input id="ns" type="password" autocomplete="new-password"></div><div class="actions"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="ns_ok">Salvar</button></div>`, "sm");
    $("#ns_ok").onclick = async () => { try { await fn("equipe", { acao: "senha", id: b.dataset.senha, senha: $("#ns").value }); fechar(); toast("Senha alterada"); } catch (e) { falha(e); } };

  $("#hook_cp").onclick = () => navigator.clipboard.writeText(hook).then(() => toast("Copiado"), () => toast("Selecione e copie o endereço manualmente.", true));

  if ($("#cd_add")) $("#cd_add").onclick = async () => {
    const codigo = $("#cd_cod").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z0-9]{2,20}$/.test(codigo)) return toast("Use de 2 a 20 letras e números, sem espaços (ex.: MS01).", true);
    if (!$("#cd_ad").value) return toast("Escolha o anúncio pela busca.", true);
    try { await q(sb.from("anuncio_codigos").insert({ codigo, meta_ad_id: $("#cd_ad").value })); toast(`Código ${codigo} cadastrado`); re(); }
    catch (e) { falha(e.code === "23505" ? new Error(`O código ${codigo} já existe.`) : e); }
  };
  $$("[data-pend]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); if ($("#cd_cod")) { $("#cd_cod").value = a.dataset.pend; $("#cd_pick").click(); } }));
  if ($("#cd_pick")) $("#cd_pick").onclick = () => {
    const cod = $("#cd_cod").value.toUpperCase().replace(/[^A-Z0-9]/g, "") || "o código";
    escolherAnuncio(`Anúncio para ${cod}`, $("#cd_ad").value, (id) => { $("#cd_ad").value = id; $("#cd_pick").textContent = nomeAd(id); });
  };
  $$("[data-cdad]").forEach((bt) => (bt.onclick = () => escolherAnuncio(`Novo anúncio para ${bt.dataset.cdad}`, bt.dataset.atual, async (id) => {
    try { await q(sb.from("anuncio_codigos").update({ meta_ad_id: id }).eq("codigo", bt.dataset.cdad)); toast(`${bt.dataset.cdad} agora aponta para ${nomeAd(id)}`); re(); }
    catch (e) { falha(e); re(); }
  })));
  $$("[data-cdativo]").forEach((i) => (i.onchange = async () => { try { await q(sb.from("anuncio_codigos").update({ ativo: i.checked }).eq("codigo", i.dataset.cdativo)); toast("Salvo"); } catch (e) { falha(e); re(); } }));
  $$("[data-cddel]").forEach((b) => (b.onclick = () => confirmar(`Excluir o código ${b.dataset.cddel}? Os leads que já chegaram continuam ligados ao anúncio.`, async () => { await q(sb.from("anuncio_codigos").delete().eq("codigo", b.dataset.cddel)); toast("Código excluído"); re(); })));
  $("#demo_on").onclick = async (e) => { e.target.disabled = true; try { const r = await q(sb.rpc("crm_demo_gerar")); toast(`${r.leads} leads de demonstração criados`); } catch (er) { falha(er); } re(); };
  if ($("#demo_off")) $("#demo_off").onclick = () => confirmar("Remover todos os dados de demonstração?", async () => { await q(sb.rpc("crm_demo_limpar")); toast("Dados de demonstração removidos"); re(); });
}

iniciar().catch(falha);
</script>
</body>
</html>
